async function loadData(){

  try{

    appDiv.innerHTML = "Loading Topics...";

    let qSnap = await getDocs(collection(db,"questions"));

    let map = {};

    qSnap.forEach(d=>{

      let q = d.data();

      if(!q.topic) return;

      if(!map[q.topic]){

        map[q.topic]={

          name:q.topic,

          category:q.category || "Technical",

          subject:q.subject || "General",

          tests:[]
        };
      }

      let exists = map[q.topic].tests.find(
        x=>x.name===q.test
      );

      if(!exists){

        map[q.topic].tests.push({

          name:q.test,

          count:1
        });

      }else{

        exists.count++;
      }

    });

    topics = Object.values(map);

    showHome();

  }catch(err){

    console.error(err);

    appDiv.innerHTML = "Failed loading";
  }
}

// ===== THEORY =====
window.showTheory = async function(i){

  let t = topics[i];

  appDiv.innerHTML = "Loading Theory...";

  let tRef = query(
  collection(db,"theory"),
  where("topic","==",t.name)
);

let snap = await getDocs(tRef);

  let theory = "";

  snap.forEach(d=>{

    let x = d.data();

    if(
      x &&
      x.topic &&
      x.topic===t.name
    ){

      if(x.content){

        theory += x.content;
      }

      if(x.image){

        theory += `

        <br><br>

        <img loading="lazy"
        src="${x.image}"

        style="
        max-width:100%;
        border-radius:10px">

        <br>`;
      }

      theory += "<hr>";
    }

  });

  appDiv.innerHTML=`

  <div style="max-width:800px;margin:auto">

    <h2>${t.name}</h2>

    <div class="card"

    style="
    line-height:1.8;
    font-size:16px;
    padding:20px;
    ">

      ${formatTheory(theory) || "No Theory Found"}

    </div>

    <button class="btn"

    onclick="openTopic(${i})">

      Back

    </button>

  </div>`;
};

  function formatTheory(content){

  if(!content) return "";

  // 🔹 Headings (## Heading)
  content = content.replace(/^## (.*$)/gim,
    '<h3 style="margin-top:15px;color:#2d3436">$1</h3>');

  // 🔹 Bold (**text**)
  content = content.replace(/\*\*(.*?)\*\*/g,
    '<b>$1</b>');

  // 🔹 Bullet points (- text)
  content = content.replace(/^- (.*$)/gim,
    '<li>$1</li>');

  // wrap list
 if(content.includes("<li>")){
  content = `<ul style="padding-left:20px">${content}</ul>`;
}
  // 🔹 Important line (!! text)
  content = content.replace(/^!! (.*$)/gim,
    '<div style="background:#ffeaa7;padding:10px;border-radius:6px;margin:10px 0"><b>$1</b></div>');

  // 🔹 Line breaks
  content = content.replace(/\n/g,"<br>");

  return content;
}

// ===== QUESTION =====
function loadQ(){
  visited[currentIndex]=true;

  let q=questions[currentIndex];

 document.getElementById("q").innerText=q.question;
  document.getElementById("img").innerHTML = q.image ? `<img src="${q.image}">` : "";

  let html="";
  q.options.forEach(opt=>{
    let sel=userAnswers[currentIndex]===opt ? "background:#0984e3;color:white" : "";

html+=`
<button class="option-btn" style="${sel}" onclick="ans('${opt}')">${opt}</button>`;
    
  });

  document.getElementById("opt").innerHTML=html;

  loadPalette();
}

window.ans=function(opt){
  userAnswers[currentIndex]=opt;
  loadQ();
};

// ===== NAV =====
window.next=function(){ if(currentIndex<questions.length-1){currentIndex++;loadQ();} };
window.prev=function(){ if(currentIndex>0){currentIndex--;loadQ();} };

// ===== MARK =====
window.markReview=function(){
  marked[currentIndex]=!marked[currentIndex];
  loadPalette();
};

// ===== PALETTE =====
function loadPalette(){
  let html="";

  questions.forEach((q,i)=>{
    let color="#b2bec3";

    if(visited[i] && !userAnswers[i]) color="#ff7675";
    if(userAnswers[i]) color="#55efc4";
    if(marked[i]) color="#ffeaa7";

    html+=`
    <button class="palette-btn"
    style="background:${color}"
    onclick="go(${i})">${i+1}</button>`;
  });

  document.getElementById("palette").innerHTML=html;
}

window.go=function(i){
  currentIndex=i;
  loadQ();
};

// ===== TIMER =====
function startTimer(){
  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{
    timeLeft--;
   let timer = document.getElementById("timer");

if(timer){

  timer.innerText = timeLeft;
}

    if(timeLeft<=0){
      clearInterval(timerInterval);
      alert("Time up!");
      submitTest();
    }
  },1000);
}

// ===== RESULT =====
window.submitTest = async function(){
  clearInterval(timerInterval);

  let score=0;

  questions.forEach((q,i)=>{
    if(userAnswers[i]===q.answer) score++;
  });

 let percent = questions.length
? Math.round((score/questions.length)*100)
: 0;

  let html=`
  <h2>Score: ${score}/${questions.length}</h2>
  <h3>Percentage: ${percent}%</h3>
  `;

  questions.forEach((q,i)=>{

    let correct = userAnswers[i]===q.answer;

    html+=`
    <div class="card" style="border-left:5px solid ${correct ? 'green':'red'}">
      ${q.question}<br>
      ${q.image?`<img src="${q.image}">`:''}

      <br><b>Your:</b> 
      <span style="color:${correct?'green':'red'}">
        ${userAnswers[i] || "Not Answered"}
      </span>

      <br><b>Correct:</b> ${q.answer}

      <p>${q.explanation||""}</p>
    </div>`;
  });

  html+=`<button class="btn" onclick="showHome()">Home</button>`;

  appDiv.innerHTML=html;
};

 document.getElementById("category").value =

document.getElementById("subject").value =

 document.getElementById("topic").value =

 // ===== LANGUAGE TRANSLATION =====

window.translateHindi = function(){

  localStorage.setItem("siteLang","hi");

  loadTranslator();
};

window.translateEnglish = function(){

  localStorage.setItem("siteLang","en");

  location.reload();
};

function loadTranslator(){

  let lang = localStorage.getItem("siteLang");

  if(lang !== "hi") return;

  // prevent duplicate script
  if(document.getElementById("googleTranslateScript")){

    autoTranslate();
    return;
  }

  let s = document.createElement("script");

  s.id = "googleTranslateScript";

  s.src =
  "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";

  document.body.appendChild(s);

  window.googleTranslateElementInit = function(){

    new google.translate.TranslateElement(
      {
        pageLanguage:'en',
        includedLanguages:'hi',
        autoDisplay:false
      },
      'google_translate_element'
    );

    setTimeout(autoTranslate,2000);
  };
}

function autoTranslate(){

  let select = document.querySelector(".goog-te-combo");

  if(select){

    select.value = "hi";

    select.dispatchEvent(new Event("change"));
  }
}

// Auto load saved language
setTimeout(loadTranslator,1000);
